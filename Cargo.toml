[package]
name = "yansit"
version = "1.0.0"
edition = "2021"
publish = false
description = "Ayna: Rust AirPlay receiver (screen mirroring + audio) for Android TV"
# AirPlay protocol design follows UxPlay (GPL-3.0); the FairPlay module is vendored from
# shairplay-rust (LGPL-3.0-or-later). The combined work is GPL-3.0-or-later.
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Owner/developer builds only: treat the device as Ayna Pro (4K, no ads) without a Play
# purchase. NEVER pass this for Google Play builds (build_bundle.sh / Gradle release).
dev-pro = []

[dependencies]
log = "0.4"
plist = { version = "1.7", default-features = false }
ed25519-dalek = { version = "2" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
sha2 = "0.10"
sha1 = "0.10"
aes-gcm = "0.10"
num-bigint = "0.4"
egui = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["media", "audio", "nativewindow", "api-level-28"] }
ndk-sys = { version = "0.6", features = ["media", "audio"] }
android_logger = "0.15"
egui_glow = "0.37"
khronos-egl = { version = "6.0", features = ["dynamic"] }

[dev-dependencies]
egui_glow = "0.37"
khronos-egl = { version = "6.0", features = ["dynamic"] }
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
overflow-checks = false

[profile.dev]
opt-level = 1
