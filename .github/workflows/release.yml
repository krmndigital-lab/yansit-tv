# Push a tag vX.Y.Z (= Cargo.toml version) -> tests -> signed AAB -> Google Play -> GitHub release.
# Secrets (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_B64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD  (Play upload key)
#   PLAY_SERVICE_ACCOUNT_JSON                                                      (Play Developer API)
# Variable PLAY_TRACK: internal | alpha (closed test, default) | beta | production.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track: internal | alpha | beta | production (empty = PLAY_TRACK variable)'
        required: false
        default: ''
      upload:
        description: 'Upload to Google Play'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: play-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
      TRACK: ${{ inputs.track || vars.PLAY_TRACK || 'alpha' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $v"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add armv7-linux-androideabi aarch64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'android/build.gradle') }}

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Tests
        run: cargo test --release

      - name: Upload key
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_STORE: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KS_KEY: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::UPLOAD_KEYSTORE_B64 secret missing"; exit 1; }
          umask 077
          printf '%s' "$KS_B64" | base64 -d > android/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_STORE" "$KS_ALIAS" "$KS_KEY" > android/keystore.properties

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Privacy check (no build-machine paths in the app)
        run: bash tools/privacy_check.sh android/build/gradle/outputs/bundle/release/Yansit-release.aab

      - name: Publish to Google Play
        if: github.event_name == 'push' || inputs.upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON secret not set yet: built and verified, NOT uploaded to Google Play"
            exit 0
          fi
          python3 -m pip install --quiet --user cryptography
          python3 tools/play/publish.py all --track "$TRACK"

      - name: GitHub release (source = this tag, GPL)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/store/release-notes/${GITHUB_REF_NAME#v}/en.txt"
          [ -f "$notes" ] || notes=/dev/null
          cp android/build/gradle/outputs/bundle/release/Yansit-release.aab "Ayna-$GITHUB_REF_NAME.aab"
          gh release create "$GITHUB_REF_NAME" --title "Ayna $GITHUB_REF_NAME" --notes-file "$notes" \
            "Ayna-$GITHUB_REF_NAME.aab" || gh release upload "$GITHUB_REF_NAME" "Ayna-$GITHUB_REF_NAME.aab" --clobber

      - name: Remove signing material
        if: always()
        run: rm -f android/release.keystore android/keystore.properties
