# Yansıt Gradle properties (committed; no secrets here — signing lives in keystore.properties).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=3
# play-services-ads depends on AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Owner/dev builds only: `./gradlew -PdevPro=true assembleDebug` compiles the Rust `dev-pro`
# feature (forces Pro). The release variant (AAB for Google Play) NEVER gets it.
devPro=false
